name: Python package check

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      revision:
        description: Exact version commit to check
        required: true
        type: string
  workflow_dispatch:
    inputs:
      revision:
        description: Commit or tag to check (defaults to selected branch)
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Test package
        run: python -m pytest tests -q
      - name: Build source and wheel distributions
        run: python -m build
